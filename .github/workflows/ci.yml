name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: End-to-end smoke test (mock models, no Ollama)
        run: |
          zeroth run --mock --profile quick --defenses none,layered --results-dir /tmp/zt --yes --report
          test -f /tmp/zt/*/report.html
      - run: zeroth calibrate
